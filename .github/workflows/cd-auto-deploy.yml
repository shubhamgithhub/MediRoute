name: MediRoute CD - Automatic Deployment

# This workflow is evaluated only after CI completes. The file must be on main.
on:
  workflow_run:
    workflows: ["MediRoute CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  gate:
    name: Check trusted auto-deployment policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.policy.outputs.deploy }}
      source_sha: ${{ steps.policy.outputs.source_sha }}
      source_branch: ${{ steps.policy.outputs.source_branch }}
    steps:
      - name: Checkout policy from protected main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Install policy parser
        run: python3 -m pip install --quiet 'PyYAML==6.0.2'

      - name: Verify completed CI, branch, exact SHA and policy
        id: policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CI_PATH: ${{ github.event.workflow_run.path }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
        run: |
          set -euo pipefail
          echo 'deploy=false' >> "$GITHUB_OUTPUT"

          # A workflow_run for a PR, fork, failed job, or rerun must never deploy.
          if [[ "$CI_EVENT" != push || "$CI_CONCLUSION" != success ||
                "$CI_ATTEMPT" != 1 || "$CI_PATH" != '.github/workflows/ci.yml' ||
                "$SOURCE_REPOSITORY_ID" != 1409686053 ]]; then
            echo 'SKIP: Not a successful first-attempt push CI run from MediRoute'
            exit 0
          fi
          case "$SOURCE_BRANCH" in
            main|feature/aws_deployment) ;;
            *) echo "SKIP: Branch not eligible: $SOURCE_BRANCH"; exit 0 ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'STOP: Invalid source commit SHA' >&2; exit 1;
          }

          # Skip old CI completions so delayed builds cannot deploy stale changes.
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$SOURCE_BRANCH" \
            --jq '.commit.sha')
          if [[ "$latest_sha" != "$SOURCE_SHA" ]]; then
            echo 'SKIP: Branch advanced beyond the completed CI commit'
            exit 0
          fi

          # The validator and policy come from main, NOT the triggering feature branch.
          python3 scripts/check_deployment_policy.py \
            infra/deployment-control.yaml "$SOURCE_BRANCH" true false \
            > /tmp/mediroute-auto-policy.json
          if ! jq -e '.deploy_requested == true' \
            /tmp/mediroute-auto-policy.json >/dev/null; then
            echo 'SKIP: auto_deploy is false or policy does not permit deployment'
            exit 0
          fi

          # A source commit may never opt in while main opts out, and a
          # source commit that opts out must not deploy while main opts in.
          # This matters when pushing the flag-off rollback to a feature branch.
          gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/contents/infra/deployment-control.yaml?ref=$SOURCE_SHA" \
            --jq '.content' | base64 --decode > /tmp/mediroute-source-policy.yaml

          source_opt_in=$(python3 - <<'PY_SOURCE_POLICY'
          import yaml
          from pathlib import Path
          policy = yaml.safe_load(Path('/tmp/mediroute-source-policy.yaml').read_text())
          deployment = policy.get('deployment') if isinstance(policy, dict) else None
          enabled = deployment.get('auto_deploy') if isinstance(deployment, dict) else None
          print('true' if enabled is True else 'false')
          PY_SOURCE_POLICY
          )
          if [[ "$source_opt_in" != true ]]; then
            echo 'SKIP: Triggering commit does not explicitly enable auto_deploy'
            exit 0
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
          echo "PASS: Automatic deployment approved for $SOURCE_BRANCH@$SOURCE_SHA"

  publish:
    name: Publish exact-CI-commit images
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
      REGISTRY: 299952487175.dkr.ecr.ap-southeast-2.amazonaws.com
    steps:
      - name: Checkout exactly the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.source_sha }}
          persist-credentials: false

      - name: Verify checked-out source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "PASS: Building exact CI commit $SOURCE_SHA"

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::299952487175:role/mediroute-github-deployment
          aws-region: ap-southeast-2
          allowed-account-ids: '299952487175'
          role-session-name: MediRouteAutoPublish-${{ github.run_id }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish immutable frontend and backend images
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 299952487175
          tag="sha-${SOURCE_SHA}"
          for component in frontend backend; do
            repository="mediroute-$component"
            image="$REGISTRY/$repository:$tag"
            if aws ecr describe-images --repository-name "$repository" \
                 --image-ids "imageTag=$tag" >/dev/null 2>/tmp/mediroute-ecr-error; then
              echo "PASS: Reusing existing immutable $image"
              continue
            fi
            if ! grep -q ImageNotFoundException /tmp/mediroute-ecr-error; then
              cat /tmp/mediroute-ecr-error >&2
              exit 1
            fi
            docker build --platform linux/amd64 \
              -f "infra/Dockerfile.$component" -t "$image" .
            docker push "$image"
            echo "PASS: Published $image"
          done

  deploy:
    name: Deploy with verified automatic stop
    needs: [gate, publish]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Coordinate with existing manual ECS workflow to avoid simultaneous launches.
    concurrency:
      group: mediroute-ecs-control
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
      SOURCE_BRANCH: ${{ needs.gate.outputs.source_branch }}
      REGISTRY: 299952487175.dkr.ecr.ap-southeast-2.amazonaws.com
      AWS_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
    steps:
      - name: Checkout trusted deployment scripts and policy from main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Install policy parser
        run: python3 -m pip install --quiet 'PyYAML==6.0.2'

      - name: Recheck branch HEAD and deployment flag after image build
        shell: bash
        run: |
          set -euo pipefail
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$SOURCE_BRANCH" \
            --jq '.commit.sha')
          if [[ "$latest_sha" != "$SOURCE_SHA" ]]; then
            echo 'STOP: Branch moved since CI; do not deploy stale images' >&2
            exit 1
          fi
          python3 scripts/check_deployment_policy.py \
            infra/deployment-control.yaml "$SOURCE_BRANCH" true false \
            > /tmp/mediroute-auto-policy.json
          jq -e '.deploy_requested == true' /tmp/mediroute-auto-policy.json >/dev/null || {
            echo 'STOP: auto_deploy disabled or branch no longer allowed' >&2
            exit 1
          }
          bash scripts/deploy_ecs.sh validate

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::299952487175:role/mediroute-github-deployment
          aws-region: ap-southeast-2
          allowed-account-ids: '299952487175'
          role-session-name: MediRouteAutoDeploy-${{ github.run_id }}

      - name: Resolve published immutable ECR image digests
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 299952487175
          tag="sha-${SOURCE_SHA}"
          for component in backend frontend; do
            digest=$(aws ecr describe-images \
              --repository-name "mediroute-$component" \
              --image-ids "imageTag=$tag" \
              --query 'imageDetails[0].imageDigest' --output text)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "STOP: Missing valid $component digest for $SOURCE_SHA" >&2
              exit 1
            }
            if [[ "$component" == backend ]]; then
              echo "BACKEND_IMAGE=$REGISTRY/mediroute-backend@$digest" >> "$GITHUB_ENV"
            else
              echo "FRONTEND_IMAGE=$REGISTRY/mediroute-frontend@$digest" >> "$GITHUB_ENV"
            fi
          done

      - name: Guarded launch and verified scheduled shutdown
        id: ecs_launch
        shell: bash
        run: |
          set -euo pipefail
          MEDIROUTE_CONFIRM_BILLABLE_RUN=YES bash scripts/deploy_ecs.sh deploy

      - name: Report Cloudflare HTTPS URL in deployment summary
        id: deployment_report
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        env:
          DEPLOYED_TASK_ARN: ${{ steps.ecs_launch.outputs.task_arn }}
          STOP_SCHEDULE: ${{ steps.ecs_launch.outputs.schedule_name }}
          STOP_AT_UTC: ${{ steps.ecs_launch.outputs.stop_time_utc }}
          DEPLOYED_BRANCH: ${{ env.SOURCE_BRANCH }}
          DEPLOYED_COMMIT: ${{ env.SOURCE_SHA }}
        run: |
          python3 scripts/report_cloudflare_url.py \
            --task-arn "$DEPLOYED_TASK_ARN" \
            --schedule-name "$STOP_SCHEDULE" \
            --stop-time-utc "$STOP_AT_UTC" \
            --branch "$DEPLOYED_BRANCH" \
            --commit "$DEPLOYED_COMMIT"
