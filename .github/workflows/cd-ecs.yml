name: MediRoute CD - ECS Control

on:
  push:
    branches:
      - main
      - feature/aws_deployment
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation (deploy starts billable Fargate compute)'
        required: true
        type: choice
        default: validate
        options:
          - validate
          - list
          - register
          - deploy
          - stop
      public_endpoint:
        description: 'Endpoint for register/deploy'
        type: choice
        required: true
        default: quick-tunnel
        options:
          - quick-tunnel
          - duckdns
      task_arn:
        description: 'Exact ECS task ARN; required for stop only'
        required: false
        type: string

permissions:
  contents: read

# Shared across the two authorized branches; never cancel a launch midway.
concurrency:
  group: mediroute-ecs-control
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ECS Deployment Scripts (no AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install policy parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Validate scripts and task template
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy_ecs.sh
          bash -n scripts/stop_ecs.sh
          python3 -m py_compile scripts/render_ecs_task.py
          bash scripts/deploy_ecs.sh validate
          bash scripts/stop_ecs.sh validate
          sh -n infra/nginx/40-mediroute-duckdns.sh
          python3 scripts/test_duckdns_deployment.py
          echo 'PASS: No AWS calls made by validation'

  control:
    name: Manual ECS Operation
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation != 'validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      OPERATION: ${{ inputs.operation }}
      MEDIROUTE_ENDPOINT_MODE: ${{ inputs.public_endpoint || 'quick-tunnel' }}
      MEDIROUTE_DUCKDNS_LABEL: ${{ vars.MEDIROUTE_DUCKDNS_LABEL }}
      MEDIROUTE_DUCKDNS_SECURITY_GROUP: ${{ vars.MEDIROUTE_DUCKDNS_SECURITY_GROUP }}
      TASK_ARN_INPUT: ${{ inputs.task_arn }}
      AWS_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install policy parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Validate operation against trusted policy and CI
        shell: bash
        run: |
          set -euo pipefail

          # Scope to exactly the two approved refs, regardless of the local YAML.
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/feature/aws_deployment) ;;
            *) echo 'STOP: This branch is not authorized'; exit 1 ;;
          esac

          # Emergency stop/list should work even when CI is failing.
          case "$OPERATION" in
            list|stop) echo "PASS: $OPERATION is a manual operational action"; exit 0 ;;
            register|deploy) ;;
            *) echo 'STOP: Invalid operation'; exit 1 ;;
          esac

          # Never trust deployment authorization from the selectable branch.
          # These files MUST first be merged to the protected default branch.
          git fetch --no-tags --depth=1 origin main
          git show FETCH_HEAD:infra/deployment-control.yaml > /tmp/mediroute-authoritative-policy.yaml
          git show FETCH_HEAD:scripts/check_deployment_policy.py > /tmp/mediroute-authoritative-gate.py

          python3 /tmp/mediroute-authoritative-gate.py \
            /tmp/mediroute-authoritative-policy.yaml \
            "$GITHUB_REF_NAME" true false > /tmp/mediroute-policy-result.json

          python3 - <<'PY'
          import fnmatch, json, os, yaml
          policy = yaml.safe_load(open('/tmp/mediroute-authoritative-policy.yaml'))['deployment']
          assert any(fnmatch.fnmatchcase(os.environ['GITHUB_REF_NAME'], b)
                     for b in policy['allowed_branches']), 'Branch not approved'
          assert type(policy['max_running_tasks']) is int and policy['max_running_tasks'] == 1
          assert policy['on_existing_demo'] == 'skip'
          assert json.load(open('/tmp/mediroute-policy-result.json'))['branch'] == os.environ['GITHUB_REF_NAME']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              print(f"MEDIROUTE_TRUSTED_MAX_RUNTIME_MINUTES={policy['max_runtime_minutes']}", file=env)
          print('PASS: Default-branch policy validated for manual operation')
          PY

          # Check for a successful push-based CI run of the exact selected SHA.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
            > /tmp/mediroute-ci-runs.json
          jq -e --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" \
            '[.workflow_runs[] | select(.head_sha == $sha and
                                      .head_branch == $branch and
                                      .event == "push" and
                                      .conclusion == "success")] | length > 0' \
            /tmp/mediroute-ci-runs.json >/dev/null || {
              echo 'STOP: Selected commit has no successful push-based CI run'
              exit 1
            }
          echo 'PASS: Selected commit CI verified'

      - name: Authenticate using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::299952487175:role/mediroute-github-deployment
          aws-region: ap-southeast-2
          allowed-account-ids: '299952487175'
          role-session-name: MediRouteCD-${{ github.run_id }}

      - name: Execute manual operation
        id: ecs_operation
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = 299952487175

          case "$OPERATION" in
            list)
              bash scripts/stop_ecs.sh list
              ;;
            stop)
              if [[ -z "$TASK_ARN_INPUT" ]]; then
                echo 'STOP: task_arn is required for manual stop' >&2
                exit 1
              fi
              MEDIROUTE_CONFIRM_STOP=YES bash scripts/stop_ecs.sh stop "$TASK_ARN_INPUT"
              ;;
            register|deploy)
              REGISTRY=299952487175.dkr.ecr.ap-southeast-2.amazonaws.com
              TAG="sha-${GITHUB_SHA}"
              for component in backend frontend; do
                digest=$(aws ecr describe-images \
                  --repository-name "mediroute-${component}" \
                  --image-ids "imageTag=${TAG}" \
                  --query 'imageDetails[0].imageDigest' --output text)
                if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "STOP: Missing/invalid digest for ${component}:${TAG}" >&2
                  echo 'Publish this exact commit with the ECR workflow first.' >&2
                  exit 1
                fi
                if [[ "$component" == backend ]]; then
                  export BACKEND_IMAGE="$REGISTRY/mediroute-backend@$digest"
                else
                  export FRONTEND_IMAGE="$REGISTRY/mediroute-frontend@$digest"
                fi
              done
              if [[ "$OPERATION" == deploy ]]; then
                echo 'WARNING: Starting a billable ECS Fargate task'
                MEDIROUTE_CONFIRM_BILLABLE_RUN=YES bash scripts/deploy_ecs.sh deploy
              else
                bash scripts/deploy_ecs.sh register
              fi
              ;;
          esac

      - name: Report Cloudflare HTTPS URL in deployment summary
        if: ${{ inputs.operation == 'deploy' && inputs.public_endpoint != 'duckdns' }}
        id: deployment_report
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        env:
          DEPLOYED_TASK_ARN: ${{ steps.ecs_operation.outputs.task_arn }}
          STOP_SCHEDULE: ${{ steps.ecs_operation.outputs.schedule_name }}
          STOP_AT_UTC: ${{ steps.ecs_operation.outputs.stop_time_utc }}
          DEPLOYED_BRANCH: ${{ github.ref_name }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/report_cloudflare_url.py \
            --task-arn "$DEPLOYED_TASK_ARN" \
            --schedule-name "$STOP_SCHEDULE" \
            --stop-time-utc "$STOP_AT_UTC" \
            --branch "$DEPLOYED_BRANCH" \
            --commit "$DEPLOYED_COMMIT"

      - name: Report DuckDNS HTTPS URL in deployment summary
        if: ${{ inputs.operation == 'deploy' && inputs.public_endpoint == 'duckdns' }}
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          DEPLOYED_TASK_ARN: ${{ steps.ecs_operation.outputs.task_arn }}
          STOP_AT_UTC: ${{ steps.ecs_operation.outputs.stop_time_utc }}
        run: |
          set -euo pipefail
          url="https://${MEDIROUTE_DUCKDNS_LABEL}.duckdns.org"
          ready=false
          for attempt in {1..12}; do
            if response=$(curl --proto '=https' --ipv4 --fail --silent \
                --connect-timeout 3 --max-time 5 "$url/api/health") &&
                jq -e '.status == "healthy" and .service == "MediRoute API"' <<< "$response" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 5
          done
          {
            printf '### MediRoute DuckDNS deployment\n\n'
            printf -- '- Branch: %s\n- Commit: %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA"
            printf -- '- URL: %s\n- Task: `%s`\n- Scheduled stop: %s UTC\n' \
              "$url" "$DEPLOYED_TASK_ARN" "$STOP_AT_UTC"
            if [[ "$ready" == true ]]; then
              printf -- '- Public HTTPS API health check succeeded.\n'
            else
              printf -- '- Public HTTPS health check pending. Check frontend logs, DNS and the security group.\n'
              echo '::warning::DuckDNS public HTTPS health check did not succeed in the reporting window.' >&2
            fi
          } >> "$GITHUB_STEP_SUMMARY"
