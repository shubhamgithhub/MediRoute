<svg xmlns="http://www.w3.org/2000/svg" width="960.0" height="1696.0" viewBox="0 0 960.0 1696.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="24.0" y="48.0" text-anchor="start" font-size="24" font-weight="700" fill="#1F2A44">MediRoute: two-step hospital discovery pipeline</text><rect x="264.0" y="88.0" width="432.0" height="72.0" rx="11" fill="#F2EFEA" stroke="#6B6B6B" stroke-width="1.6"/><text x="480.0" y="114.4" text-anchor="middle" font-size="17" font-weight="700" fill="#333333">Patient input</text><text x="480.0" y="144.0" text-anchor="middle" font-size="13" fill="#555555">query text · optional report text (PDF)</text><rect x="24.0" y="188.0" width="912.0" height="832.0" rx="16" fill="none" stroke="#B5B5B5" stroke-width="1.4" stroke-dasharray="7 5"/><text x="916.0" y="224.0" text-anchor="end" font-size="18" font-weight="700" fill="#1F2A44">Step 1: patient input to suggested speciality</text><rect x="216.0" y="230.0" width="528.0" height="76.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="480.0" y="258.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">Protect + emergency rules</text><text x="480.0" y="288.0" text-anchor="middle" font-size="13" fill="#1F7A58">remove phone / e-mail / IDs · red flags add a notice</text><polyline points="480.0,160.0 480.0,230.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="368.0" y="354.0" width="528.0" height="84.0" rx="11" fill="#EEEDFD" stroke="#6A5ACD" stroke-width="1.6"/><text x="632.0" y="386.4" text-anchor="middle" font-size="17" font-weight="700" fill="#3B2E8C">Extract evidence</text><text x="632.0" y="416.0" text-anchor="middle" font-size="13" fill="#5B4DB0">LLM + speciality keywords; code keeps phrases in the text</text><rect x="64.0" y="354.0" width="264.0" height="84.0" rx="11" fill="#F2EFEA" stroke="#6B6B6B" stroke-width="1.6"/><text x="196.0" y="386.4" text-anchor="middle" font-size="17" font-weight="700" fill="#333333">Lookup list (10,584)</text><text x="196.0" y="416.0" text-anchor="middle" font-size="13" fill="#555555">ICD-10-CM + CGHS to speciality</text><polyline points="480.0,306.0 480.0,336.0 632.0,336.0 632.0,354.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="64.0" y="514.0" width="256.0" height="84.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="192.0" y="546.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">V1 keyword search</text><text x="192.0" y="576.0" text-anchor="middle" font-size="13" fill="#1F7A58">TF-IDF over lookup list</text><rect x="352.0" y="514.0" width="256.0" height="84.0" rx="11" fill="#EEEDFD" stroke="#6A5ACD" stroke-width="1.6"/><text x="480.0" y="546.4" text-anchor="middle" font-size="17" font-weight="700" fill="#3B2E8C">V2 meaning search</text><text x="480.0" y="576.0" text-anchor="middle" font-size="13" fill="#5B4DB0">embeddings over lookup list</text><rect x="640.0" y="514.0" width="256.0" height="84.0" rx="11" fill="#EEEDFD" stroke="#6A5ACD" stroke-width="1.6"/><text x="768.0" y="546.4" text-anchor="middle" font-size="17" font-weight="700" fill="#3B2E8C">V3 local LLM</text><text x="768.0" y="576.0" text-anchor="middle" font-size="13" fill="#5B4DB0">picks from 26-speciality list</text><polyline points="128.0,438.0 128.0,514.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="288.0,438.0 288.0,468.0 424.0,468.0 424.0,514.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="632.0,438.0 632.0,488.0" fill="none" stroke="#4A4A4A" stroke-width="1.6"/><polyline points="232.0,488.0 768.0,488.0" fill="none" stroke="#4A4A4A" stroke-width="1.6"/><polyline p