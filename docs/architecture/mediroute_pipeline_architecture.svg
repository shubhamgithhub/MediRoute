<svg xmlns="http://www.w3.org/2000/svg" width="960.0" height="1744.0" viewBox="0 0 960.0 1744.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A4A4A"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="24.0" y="48.0" text-anchor="start" font-size="24" font-weight="700" fill="#1F2A44">MediRoute: two-step hospital discovery pipeline</text><rect x="264.0" y="88.0" width="432.0" height="72.0" rx="11" fill="#F2EFEA" stroke="#6B6B6B" stroke-width="1.6"/><text x="480.0" y="114.4" text-anchor="middle" font-size="17" font-weight="700" fill="#333333">Patient input</text><text x="480.0" y="144.0" text-anchor="middle" font-size="13" fill="#555555">query text · optional report text (PDF)</text><rect x="24.0" y="188.0" width="912.0" height="936.0" rx="16" fill="none" stroke="#B5B5B5" stroke-width="1.4" stroke-dasharray="7 5"/><text x="916.0" y="224.0" text-anchor="end" font-size="18" font-weight="700" fill="#1F2A44">Step 1: patient input to suggested speciality</text><rect x="216.0" y="230.0" width="528.0" height="76.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="480.0" y="258.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">Protect + emergency rules</text><text x="480.0" y="288.0" text-anchor="middle" font-size="13" fill="#1F7A58">remove phone / e-mail / IDs · red flags add a notice</text><polyline points="480.0,160.0 480.0,230.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="368.0" y="354.0" width="528.0" height="84.0" rx="11" fill="#EEEDFD" stroke="#6A5ACD" stroke-width="1.6"/><text x="632.0" y="386.4" text-anchor="middle" font-size="17" font-weight="700" fill="#3B2E8C">Extract evidence</text><text x="632.0" y="416.0" text-anchor="middle" font-size="13" fill="#5B4DB0">LLM copies conditions, procedures, body parts + keywords</text><rect x="64.0" y="354.0" width="264.0" height="84.0" rx="11" fill="#F2EFEA" stroke="#6B6B6B" stroke-width="1.6"/><text x="196.0" y="386.4" text-anchor="middle" font-size="17" font-weight="700" fill="#333333">Lookup list (11,057)</text><text x="196.0" y="416.0" text-anchor="middle" font-size="13" fill="#555555">ICD-10-CM + CGHS + lay terms</text><polyline points="480.0,306.0 480.0,336.0 632.0,336.0 632.0,354.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="368.0" y="456.0" width="528.0" height="96.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="632.0" y="494.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">Clean evidence (data correction)</text><text x="632.0" y="524.0" text-anchor="middle" font-size="13" fill="#1F7A58">keep phrases found in the text · drop generic words</text><text x="632.0" y="542.4" text-anchor="middle" font-size="12" font-weight="400" fill="#1F7A58">e.g. drops &#x27;treatment&#x27;, &#x27;hospital&#x27;, &#x27;Mumbai&#x27;, &#x27;since last month&#x27;</text><polyline points="632.0,438.0 632.0,456.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="64.0" y="618.0" width="256.0" height="84.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="192.0" y="650.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">V1 keyword search</text><text x="192.0" y="680.0" text-anchor="middle" font-size="13" fill="#1F7A58">TF-IDF over lookup list</text><rect x="352.0" y="618.0" width="256.0" height="84.0" rx="11" fill="#EEEDFD" stroke="#6A5ACD" stroke-width="1.6"/><text x="480.0" y="650.4" text-anchor="middle" font-size="17" font-weight="700" fill="#3B2E8C">V2 meaning search</text><text x="480.0" y="680.0" text-anchor="middle" font-size="13" fill="#5B4DB0">embeddings over lookup list</text><rect x="640.0" y="618.0" width="256.0" height="84.0" rx="11" fill="#EEEDFD" stroke="#6A5ACD" stroke-width="1.6"/><text x="768.0" y="650.4" text-anchor="middle" font-size="17" font-weight="700" fill="#3B2E8C">V3 local LLM</text><text x="768.0" y="680.0" text-anchor="middle" font-size="13" fill="#5B4DB0">picks from 26-speciality list</text><polyline points="128.0,438.0 128.0,618.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="288.0,438.0 288.0,572.0 424.0,572.0 424.0,618.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="632.0,552.0 632.0,592.0" fill="none" stroke="#4A4A4A" stroke-width="1.6"/><polyline points="232.0,592.0 768.0,592.0" fill="none" stroke="#4A4A4A" stroke-width="1.6"/><polyline points="232.0,592.0 232.0,618.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="528.0,592.0 528.0,618.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="768.0,592.0 768.0,618.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="216.0" y="762.0" width="528.0" height="84.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="480.0" y="794.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">Majority vote</text><text x="480.0" y="824.0" text-anchor="middle" font-size="13" fill="#1F7A58">2 of 3 agree + evidence in the text</text><polyline points="192.0,702.0 192.0,732.0 768.0,732.0" fill="none" stroke="#4A4A4A" stroke-width="1.6"/><polyline points="768.0,702.0 768.0,732.0" fill="none" stroke="#4A4A4A" stroke-width="1.6"/><polyline points="480.0,702.0 480.0,732.0" fill="none" stroke="#4A4A4A" stroke-width="1.6"/><polyline points="480.0,732.0 480.0,762.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="36.0" y="890.0" width="368.0" height="84.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="220.0" y="922.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">Clarification form</text><text x="220.0" y="952.0" text-anchor="middle" font-size="13" fill="#1F7A58">max 2 rounds, then user picks</text><rect x="536.0" y="890.0" width="368.0" height="84.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="720.0" y="922.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">Suggested speciality</text><text x="720.0" y="952.0" text-anchor="middle" font-size="13" fill="#1F7A58">to search, with evidence + disclaimer</text><polyline points="360.0,846.0 360.0,890.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="268.0" y="873.6" font-size="12.5" font-style="italic" fill="#4A4A4A">no majority</text><polyline points="600.0,846.0 600.0,890.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="609.6" y="873.6" font-size="12.5" font-style="italic" fill="#4A4A4A">yes</text><polyline points="404.0,932.0 536.0,932.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="420.0" y="921.6" font-size="12.5" font-style="italic" fill="#4A4A4A">user picks</text><polyline points="36.0,932.0 36.0,321.6 416.0,321.6 416.0,354.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="44.0" y="768.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#4A4A4A">answers added,</text><text x="44.0" y="788.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#4A4A4A">re-run</text><rect x="40.0" y="1026.0" width="560.0" height="68.0" rx="11" fill="#F2EFEA" stroke="#6B6B6B" stroke-width="1.6"/><text x="320.0" y="1050.4" text-anchor="middle" font-size="17" font-weight="700" fill="#333333">Per-request trace</text><text x="320.0" y="1080.0" text-anchor="middle" font-size="13" fill="#555555">logs/step1_trace.jsonl: input, LLM calls, votes, decision</text><rect x="24.0" y="1156.0" width="912.0" height="504.0" rx="16" fill="none" stroke="#B5B5B5" stroke-width="1.4" stroke-dasharray="7 5"/><text x="44.0" y="1192.0" text-anchor="start" font-size="18" font-weight="700" fill="#1F2A44">Step 2: speciality to ranked hospitals (HospitalRecommendationEngine)</text><polyline points="720.0,974.0 720.0,1206.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="536.0" y="1206.0" width="368.0" height="76.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="720.0" y="1234.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">Hard filters</text><text x="720.0" y="1264.0" text-anchor="middle" font-size="13" fill="#1F7A58">speciality (normalised) · then city / state</text><rect x="56.0" y="1206.0" width="368.0" height="76.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="240.0" y="1234.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">No match</text><text x="240.0" y="1264.0" text-anchor="middle" font-size="13" fill="#1F7A58">no speciality: say so · no city: ask to widen</text><polyline points="536.0,1244.0 424.0,1244.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="436.0" y="1233.6" font-size="12.5" font-style="italic" fill="#4A4A4A">none left</text><rect x="56.0" y="1322.0" width="368.0" height="76.0" rx="11" fill="#F2EFEA" stroke="#6B6B6B" stroke-width="1.6"/><text x="240.0" y="1350.4" text-anchor="middle" font-size="17" font-weight="700" fill="#333333">Hospital index (150)</text><text x="240.0" y="1380.0" text-anchor="middle" font-size="13" fill="#555555">FAISS + metadata · to rebuild from master</text><rect x="536.0" y="1312.0" width="368.0" height="96.0" rx="11" fill="#EEEDFD" stroke="#6A5ACD" stroke-width="1.6"/><text x="720.0" y="1350.4" text-anchor="middle" font-size="17" font-weight="700" fill="#3B2E8C">Semantic search</text><text x="720.0" y="1380.0" text-anchor="middle" font-size="13" fill="#5B4DB0">query: speciality + diagnoses + procedures</text><text x="720.0" y="1398.4" text-anchor="middle" font-size="12" font-weight="400" fill="#5B4DB0">multi-qa-MiniLM cosine · top 3×K candidates</text><polyline points="720.0,1282.0 720.0,1312.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="424.0,1360.0 536.0,1360.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="536.0" y="1432.0" width="368.0" height="96.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="720.0" y="1470.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">Rerank: semantic + bonus</text><text x="720.0" y="1500.0" text-anchor="middle" font-size="13" fill="#1F7A58">bonus ≤ 0.20, each one listed as a reason</text><text x="720.0" y="1518.4" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1F7A58">procedure ≤.08 · verified .03 · NABH .02 · JCI .02 · intl .02</text><polyline points="720.0,1408.0 720.0,1432.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="536.0" y="1558.0" width="368.0" height="76.0" rx="11" fill="#E3F4EE" stroke="#2E8B6A" stroke-width="1.6"/><text x="720.0" y="1586.4" text-anchor="middle" font-size="17" font-weight="700" fill="#0F5C40">Ranked hospitals (top 5)</text><text x="720.0" y="1616.0" text-anchor="middle" font-size="13" fill="#1F7A58">final score + ranking reasons</text><polyline points="720.0,1528.0 720.0,1558.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="56.0" y="1460.0" width="368.0" height="160.0" rx="11" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.6" stroke-dasharray="7 4"/><text x="240.0" y="1492.0" text-anchor="middle" font-size="17" font-weight="700" fill="#555555">Planned, not built yet</text><text x="76.0" y="1520.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#666666">· AHP-TOPSIS: tested weights (fit &gt; location)</text><text x="76.0" y="1548.8" text-anchor="start" font-size="12.5" font-weight="400" fill="#666666">· grounded LLM explanation per hospital</text><text x="76.0" y="1577.6" text-anchor="start" font-size="12.5" font-weight="400" fill="#666666">· keyword + FAISS hybrid retrieval</text><text x="76.0" y="1606.4" text-anchor="start" font-size="12.5" font-weight="400" fill="#666666">· CGHS cost (display only, deferred)</text><rect x="40.0" y="1692.0" width="22" height="22" rx="5" fill="#EEEDFD" stroke="#6A5ACD"/><text x="73.6" y="1710.4" text-anchor="start" font-size="15" font-weight="400" fill="#333333">LLM or embeddings</text><rect x="276.0" y="1692.0" width="22" height="22" rx="5" fill="#E3F4EE" stroke="#2E8B6A"/><text x="309.6" y="1710.4" text-anchor="start" font-size="15" font-weight="400" fill="#333333">Deterministic code</text><rect x="512.0" y="1692.0" width="22" height="22" rx="5" fill="#F2EFEA" stroke="#6B6B6B"/><text x="545.6" y="1710.4" text-anchor="start" font-size="15" font-weight="400" fill="#333333">Input or data</text><rect x="748.0" y="1692.0" width="22" height="22" rx="5" fill="#FFFFFF" stroke="#9A9A9A" stroke-dasharray="5 3"/><text x="781.6" y="1710.4" text-anchor="start" font-size="15" font-weight="400" fill="#333333">Planned</text></svg>