ty</text><polyline points="600.0,742.0 600.0,786.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="609.6" y="769.6" font-size="12.5" font-style="italic" fill="#4A4A4A">yes</text><polyline points="404.0,828.0 536.0,828.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="420.0" y="817.6" font-size="12.5" font-style="italic" fill="#4A4A4A">user picks</text><polyline points="36.0,828.0 36.0,321.6 416.0,321.6 416.0,354.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="44.0" y="640.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#4A4A4A">answers added,</text><text x="44.0" y="660.0" text-anchor="start" font-size="12.5" font-weight="400" fill="#4A4A4A">re-run</text><rect x="40.0" y="922.0" width="560.0" height="68.0" rx="11" fill="#F2EFEA" stroke="#6B6B6B" stroke-width="1.6"/><text x="320.0" y="946.4" text-anchor="middle" font-size="17" font-weight="700" fill="#333333">Per-request trace</text><text x="320.0" y="976.0" text-anchor="middle" font-size="13" fill="#555555">logs/step1_trace.jsonl: input, LLM calls, votes, decision</text><rect x="24.0" y="1052.0" width="912.0" height="552.0" rx="16" fill="none" stroke="#B5B5B5" stroke-width="1.4" stroke-dasharray="7 5"/><text x="44.0" y="1088.0" text-anchor="start" font-size="18" font-weight="700" fill="#1F2A44">Step 2: speciality to ranked hospitals</text><polyline points="720.0,870.0 720.0,1138.0" fill="none" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="56.0" y="1142.0" width="368.0" height="76.0" rx="11" fill="#F2EFEA" stroke="#6B6B6B" stroke-width="1.6"/><text x="240.0" y="1170.4" text-anchor="middle" font-size="17" font-weight="700" fill="#333333">Verified hospital data</text><text x="240.0" y="1200.0" text-anchor="middle" font-size="13" fill="#555555">NABH / JCI + websites (100 hospitals)</text><rect x="536.0" y="1142.0" width="368.0" height="76.0" rx="11"