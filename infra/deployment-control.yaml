# Authoritative copy must live in the PROTECTED DEFAULT BRANCH.
# This starter is disabled until tests, scheduled stop, and safety gates pass.
deployment:
  auto_deploy: true
  allowed_branches:
    - main
    - pravin
    - "feature/**"
  environment: dev
  max_runtime_minutes: 120
  max_running_tasks: 1
  on_existing_demo: skip
