server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Avoid logging request URL/query strings that may include clinical context.
    access_log off;

    # Frontend static documents, simple HTML pages and resources.
    location / {
        try_files $uri $uri/ =404;
    }

    # Do NOT strip /api prefix: the FastAPI routes already include it.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        client_max_body_size 10m;  # Developer must approve actual upload limit.
    }
}
