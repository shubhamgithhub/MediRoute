[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediroute"
version = "0.1.0"
description = "AI-assisted patient-to-hospital routing: medical context extraction, specialty inference and hybrid FAISS + keyword hospital retrieval."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MediRoute team" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "pandas>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "faiss-cpu>=1.8",
    "sentence-transformers>=2.6",
    "transformers>=4.40",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# Web scrapers in mediroute.data_generator (run `playwright install chromium` after)
scraping = ["playwright>=1.40"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
mediroute-api = "mediroute.backend.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*", "run_tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
